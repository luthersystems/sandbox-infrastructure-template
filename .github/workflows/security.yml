name: Security

# The org's shared security checks: govulncheck, gosec, gitleaks and
# osv-scanner, from luthersystems/.github. One workflow in every repo gives
# each repo the same checks, tool versions and fail rule, and an org ruleset
# requires its one check, "security / result". How to exempt a finding and
# why each check exists: docs/security-workflow.md in luthersystems/.github.

on:
  # The merge queue runs the required checks on the merged result.
  merge_group:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A scheduled run finds advisories published after the last change, and
    # opens a security-drift issue when one appears.
    # Nightly: this repo is public, so Actions minutes are free.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id must stay "security": the ruleset requires "security / result".
  security:
    # Every deploy pushes this template's tree to the project's <id>-infra
    # repo, workflows included. The guard keeps the checks (and the nightly
    # run and its security-drift issue) in the template repo, as quality.yml
    # does, so the -infra repos do not run them.
    if: github.repository == 'luthersystems/sandbox-infrastructure-template'
    permissions:
      contents: read
      issues: write # the security-drift issue on scheduled runs
    # Pinned to a commit, as every action here is, so a moved v1 tag cannot
    # change what runs; the same pin as luthersystems/elps, and Dependabot
    # (.github/dependabot.yml) moves it.
    uses: luthersystems/.github/.github/workflows/security.yml@870afa409a35ed174b67d86c5ac4ed6da848cad8 # v1.9.1
