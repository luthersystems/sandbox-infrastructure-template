name: Validate

on:
  push:
    branches:
      - main
  # The merge queue runs the required checks on the merged result.
  merge_group:
  # No paths filter: the gate job below is a required check, so every PR
  # must start a run. The changes job skips the other jobs on docs-only PRs.
  pull_request:
    branches:
      - main

jobs:
  # Decides whether the validate and test jobs must run
  # (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: bash scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  terraform-validate:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: "terraform validate (${{ matrix.dir }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - account-provision
          - account-setup
          - cloud-provision
          - vm-provision
          - k8s-provision
          - custom-stack-provision
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Activate cloud templates for validation
        run: |
          # Copy AWS templates for CI validation. GCP templates are
          # validated at deploy time when the GCP provider is active.
          for tmpl in providers-aws.tf.tmpl aws-resources.tf.tmpl; do
            if [ -e "$tmpl" ]; then cp "$tmpl" "${tmpl%.tmpl}"; fi
          done
        working-directory: tf/${{ matrix.dir }}

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: tf/${{ matrix.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: tf/${{ matrix.dir }}

  terraform-validate-gcp:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: "terraform validate (cloud-provision GCP)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Activate GCP templates for validation
        run: |
          for tmpl in providers-gcp.tf.tmpl gcp-resources.tf.tmpl; do
            if [ -e "$tmpl" ]; then cp "$tmpl" "${tmpl%.tmpl}"; fi
          done
        working-directory: tf/cloud-provision

      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: tf/cloud-provision

      - name: Terraform Validate
        run: terraform validate
        working-directory: tf/cloud-provision

  terraform-fmt:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: tf

  shell-lint:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check
        run: |
          shopt -s globstar
          status=0
          for f in **/*.sh; do
            [[ "$f" == .terraform/* || "$f" == .tmp/* ]] && continue
            if ! bash -n "$f"; then
              status=1
            fi
          done
          exit $status

      - name: ShellCheck
        run: |
          shopt -s globstar
          files=()
          for f in **/*.sh; do
            [[ "$f" == .terraform/* || "$f" == .tmp/* ]] && continue
            files+=("$f")
          done
          shellcheck -x -S warning "${files[@]}"

  tests:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Configure git identity
        run: |
          git config --global user.email "ci@luthersystems.com"
          git config --global user.name "CI"

      # The scripts' -infra git steps (mars infra-*) and their stages (mars
      # plan-all, plan-stage, apply-stage; #114) are mars commands, so the
      # tests run a native mars at the pinned .mars-version. A release older
      # than those commands fails the tests, as it would fail a deploy.
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Install mars at .mars-version
        env:
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/luthersystems/mars/cmd/mars@$(tr -d '[:space:]' < .mars-version)"
          echo "MARS_INFRA_BIN=$(go env GOPATH)/bin/mars" >> "$GITHUB_ENV"

      # The scoped deploy policy is generated from the presets
      # (scripts/policygen.sh, #194). This fails when the committed files
      # differ from the generator at the pinned presets version.
      - name: Check the generated deploy policies
        env:
          GOTOOLCHAIN: auto
        run: bash scripts/policygen.sh -check

      - name: Run tests
        run: |
          # These run the real mars; the others mock it, as locally.
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-prepare-custom-stack.sh
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-infra-push.sh
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-apply-scripts.sh
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-drift-check.sh
          bash tests/test-tf-destroy-init.sh
          bash tests/test-mars-entrypoint-compat.sh
          bash tests/test-reverse-import-wrapper.sh
          bash tests/test-external-id.sh
          bash tests/test-state-backend-output-parity.sh
          bash tests/test-state-region.sh
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-plan-all.sh
          bash tests/test-gcp-preflight.sh
          bash tests/test-gcp-keyless-credentials.sh
          bash tests/test-aws-preflight.sh
          bash tests/test-destroy-preflight-skip.sh
          MARS_BIN="$MARS_INFRA_BIN" bash tests/test-drift-refresh-preflight-skip.sh
          bash tests/test-preflight-binary-swap.sh
          bash tests/test-aws-credential-guard.sh
          bash tests/test-repo-org-pin.sh
          bash tests/test-deploy-policy-mode.sh
          bash tests/test-gcp-management-identity.sh
          bash tests/test-provider-selection.sh
          bash tests/test-template-version.sh

  # The one check the main ruleset requires from this workflow. It needs
  # every job, so "terraform validate (cloud-provision GCP)" and each matrix
  # leg of "terraform validate" are required through it.
  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, terraform-validate, terraform-validate-gcp, terraform-fmt, shell-lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
