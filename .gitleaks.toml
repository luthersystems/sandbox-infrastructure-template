# Gitleaks config for the shared security check (luthersystems/.github,
# job `security / secrets`). It keeps the default rules and allows only
# test values that are not secrets.
#
# Each allowlist matches on the line's exact value AND on the file path, so a
# real secret on another line of the same file still fails the check.
# Why not .gitleaksignore: its fingerprints name a line number, which moves
# whenever a line is added above it.
#
# Deploys copy this template into each <project>-infra repo, so this file
# also keeps those repos' scheduled scans clean.

[extend]
useDefault = true

[[allowlists]]
description = "Test fixture: gcp_credentials_b64 is the base64 of {\"client_email\":\"deployer@cust-proj.iam.gserviceaccount.com\"}, a made-up account with no key. The stage reads the uploaded key only for its client_email."
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*gcp_credentials_b64\s*=\s*"eyJjbGllbnRfZW1haWwiOiJkZXBsb3llckBjdXN0LXByb2ouaWFtLmdzZXJ2aWNlYWNjb3VudC5jb20ifQ=="\s*$''']
paths = ['''^tests/fixtures/gcp-management-identity/tests/mgmt\.tftest\.hcl$''']
